<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW Hub - Demon Slayer S1</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-card {
            width: 90%;
            max-width: 900px;
            background: #161616;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }

        .video-header {
            padding: 15px 20px;
            background: linear-gradient(90deg, #e50914, #0b0b0b);
        }

        .video-header h1 {
            margin: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Responsive Video Container */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            padding: 20px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            background: #333;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn:hover {
            background: #e50914;
        }

        .btn-download {
            background: #e50914;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="video-header">
            <h1>Demon Slayer: S1 Episode 1 (Hindi Dubbed)</h1>
        </div>

        <div class="video-wrapper">
            <iframe 
                src="https://voe.sx/e/mfqeaptjjdon" 
                allowfullscreen 
                allow="autoplay" 
                scrolling="no">
            </iframe>
        </div>

        <div class="video-info">
            <p style="color: #bbb; font-size: 14px; margin-bottom: 15px;">
                Tanjiro Kamado's journey begins here. Watch the high-quality stream of Season 1.
            </p>
            
            <div class="btn-group">
                <a href="https://voe.sx/mfqeaptjjdon" target="_blank" class="btn btn-download">Download Video</a>
                <a href="#" class="btn">Next Episode</a>
            </div>
        </div>
    </div>

</body>
</html>
