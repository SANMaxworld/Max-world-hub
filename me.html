<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MW Hub - My Dashboard</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <style>
        /* --- GLOBAL RESET & THEME (STRICTLY LOCKED) --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-main: #0e0e11; --bg-card: #1c1c22; --text-main: #ffffff; --text-sub: #8e8e93;
            --accent-green: #00d26a; --accent-red: #ff3b30; --divider: #2a2a30;
            --red-gradient: linear-gradient(90deg, #4b0000 0%, #8b0000 100%);
        }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
        .icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; }
        .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon-fill svg { fill: currentColor; stroke: none; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 16px 15px; position: relative; }
        .profile-area { display: flex; align-items: center; gap: 12px; }
        .profile-pic { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #333; border: 1px solid var(--divider); }
        .profile-info { display: flex; flex-direction: column; gap: 6px; }
        .profile-name-row { display: flex; align-items: center; gap: 4px; }
        .profile-name { font-size: 18px; font-weight: 600; }
        .arrow-right { color: var(--text-sub); font-size: 14px; }
        .badge-row { display: flex; align-items: center; gap: 8px; }
        .badge { background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 4px; font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        .badge-blue { color: #4facfe; } .badge-pink { color: #ff66b2; }
        .auth-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--divider); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; align-self: center; transition: 0.2s; }
        .auth-btn:active { opacity: 0.7; }

        /* ANNOUNCEMENT */
        .announcement { background: var(--red-gradient); backdrop-filter: blur(10px); color: #fff; padding: 10px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-weight: 500; }

        /* MENU BLOCKS */
        .menu-group { background: var(--bg-card); border-radius: 12px; margin: 0 16px 16px; overflow: hidden; padding-top: 5px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--divider); cursor: pointer; text-decoration: none; color: inherit; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item-left { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; color: #e5e5e5; }
        .menu-item-left .icon { color: #b0b0b0; }
        .menu-item-right { display: flex; align-items: center; gap: 8px; color: var(--text-sub); font-size: 14px; }

        /* WATCH HISTORY */
        .history-wrapper { padding: 10px 16px 16px; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .history-wrapper::-webkit-scrollbar { display: none; }
        .history-card { flex: 0 0 140px; position: relative; text-decoration: none; display: block; }
        .history-img-box { position: relative; width: 100%; height: 80px; border-radius: 6px; overflow: hidden; background: #333; }
        .history-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .tv-icon { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.6); padding: 2px; border-radius: 4px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
        .progress-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.3); }
        .progress-fill { height: 100%; background: var(--accent-green); }
        .history-title { font-size: 12px; color: #ccc; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* FOOTER */
        .footer-text { text-align: center; font-size: 12px; color: var(--text-sub); padding: 10px 0 30px; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: var(--bg-card); display: flex; justify-content: space-around; align-items: center; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); text-decoration: none; width: 33.33%; position: relative; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item span { font-size: 10px; font-weight: 500; }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-card); width: 100%; max-width: 350px; border-radius: 16px; padding: 24px; position: relative; border: 1px solid var(--divider); max-height: 80vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 15px; color: var(--text-sub); font-size: 20px; cursor: pointer; }
        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; text-align: center; color: var(--text-main); }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
        .input-box { width: 100%; background: var(--bg-main); border: 1px solid var(--divider); color: var(--text-main); padding: 12px; border-radius: 8px; outline: none; font-size: 14px; }
        .upload-container { display: flex; align-items: center; gap: 15px; background: var(--bg-main); padding: 10px; border-radius: 8px; border: 1px solid var(--divider); cursor: pointer; }
        .preview-circle { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #333; }
        .upload-text { font-size: 13px; color: var(--accent-green); font-weight: 500; }
        .gender-selector { display: flex; gap: 10px; }
        .gender-btn { flex: 1; padding: 10px; background: var(--bg-main); border: 1px solid var(--divider); color: var(--text-sub); border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; }
        .gender-btn.active { background: rgba(0, 210, 106, 0.1); border-color: var(--accent-green); color: var(--accent-green); font-weight: bold; }
        .save-btn { width: 100%; padding: 14px; border-radius: 8px; background: var(--accent-green); color: #000; font-weight: 700; text-align: center; border: none; cursor: pointer; margin-top: 10px; transition: 0.3s; opacity: 0.5; pointer-events: none; }
        .save-btn.ready { opacity: 1; pointer-events: auto; }

        /* ADDED LIST */
        .added-card-link { text-decoration: none; display: block; }
        .vertical-added-list { display: flex; flex-direction: column; gap: 12px; }
        .added-card { display: flex; align-items: center; gap: 12px; background: var(--bg-main); padding: 8px; border-radius: 8px; border: 1px solid var(--divider); }
        .added-card img { width: 60px; height: 80px; object-fit: cover; border-radius: 4px; }
        .added-card-title { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

            <div class="menu-item-left">🎧 Support</div>
            <div class="menu-item-right">›</div>
        </a>
    </div>

    <div class="bottom-nav">

        <a href="../index.html" class="nav-item">🏠<span>Home</span></a>
        <a href="#" class="nav-item active">👤<span>Me</span></a>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="close-btn" onclick="window.closeModal()">✕</div>
            <div class="modal-title">Edit Profile</div>
            <div class="input-group">
                <label>Profile Picture</label>

            </div>
            <div class="input-group">

            if (path.startsWith("http") || path.startsWith("data:")) return path;

        window.googleLogin = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, async (user) => {

            if (user) {

                if (authBtn) authBtn.innerText = "Switch Account"; // CHANGED HERE

            }
            else {

                if (authBtn) authBtn.innerText = "Login"; // CHANGED HERE

        async function loadUserData() {
            const snap = await getDoc(doc(db, "users", currentUser.uid));

                const data = snap.data();

            const container = document.getElementById('historyContainer');
            if(!history || history.length === 0) {
                container.innerHTML = '<div class="footer-text" style="width:100%;">No history found.</div>';
                return;
            }
            container.innerHTML = history.map(item => {
                const progress = (item.currentEp / item.totalEp) * 100 || 0;
                return `
                    <a href="./anime/${item.id}.html" class="history-card">
                        <div class="history-img-box">
                            <img src="${fixPath(item.poster)}" class="history-img" onerror="this.src='assets/placeholder.jpg'">
                            <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
                        </div>
                        <div class="history-title">${item.title}</div>
                    </a>
                `;
            }).join('');
        }

        function renderAdded(added) {
            const container = document.getElementById('addedContainer');
            if(!added || added.length === 0) {
                container.innerHTML = '<div class="footer-text">No bookmarks yet.</div>';
                return;
            }
            container.innerHTML = added.map(item => `
                <a href="./anime/${item.id}.html" class="added-card-link">
                    <div class="added-card">
                        <img src="${fixPath(item.poster)}" onerror="this.src='assets/placeholder.jpg'">
                        <div class="added-card-title">${item.title}</div>
                    </div>
                </a>
            `).join('');
        }

        window.openModal = () => document.getElementById('editModal').classList.add('show');
        window.closeModal = () => document.getElementById('editModal').classList.remove('show');
        window.openAddedModal = () => document.getElementById('addedModal').classList.add('show');
        window.closeAddedModal = () => document.getElementById('addedModal').classList.remove('show');

        window.selectGender = (g, c) => {
            selectedGender = g; currentGenderClass = c;
            document.getElementById('btnMale').classList.toggle('active', g === '♂');
            document.getElementById('btnFemale').classList.toggle('active', g === '♀');
        };

        window.handleImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    profileImageBase64 = e.target.result;
                    document.getElementById('previewImg').src = profileImageBase64;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.checkValidation = () => {
            const name = document.getElementById('inputName').value.trim();
            const idVal = document.getElementById('inputId').value.toString();
            const btn = document.getElementById('saveBtn');
            if(name.length > 2 && idVal.length === 9) btn.classList.add('ready');
            else btn.classList.remove('ready');
        };

            const aid = document.getElementById('inputId').value.toString();
