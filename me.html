<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MW Hub - My Dashboard</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-main: #0e0e11; --bg-card: #1c1c22; --text-main: #ffffff; --text-sub: #8e8e93;
            --accent-green: #00d26a; --accent-red: #ff3b30; --divider: #2a2a30;
            --red-gradient: linear-gradient(90deg, #4b0000 0%, #8b0000 100%);
        }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
        
        .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 16px 15px; position: relative; }
        .profile-area { display: flex; align-items: center; gap: 12px; }
        .profile-pic { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #333; border: 1px solid var(--divider); }
        .profile-info { display: flex; flex-direction: column; gap: 6px; }
        .profile-name-row { display: flex; align-items: center; gap: 4px; }
        .profile-name { font-size: 18px; font-weight: 600; }
        .arrow-right { color: var(--text-sub); font-size: 14px; }
        .badge-row { display: flex; align-items: center; gap: 8px; }
        .badge { background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 4px; font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        .badge-blue { color: #4facfe; } .badge-pink { color: #ff66b2; }
        
        .auth-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--divider); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; align-self: center; transition: 0.2s; }
        
        .announcement { background: var(--red-gradient); backdrop-filter: blur(10px); color: #fff; padding: 10px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-weight: 500; }

        .menu-group { background: var(--bg-card); border-radius: 12px; margin: 0 16px 16px; overflow: hidden; padding-top: 5px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--divider); cursor: pointer; text-decoration: none; color: inherit; }
        .menu-item-left { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; color: #e5e5e5; }
        .menu-item-right { display: flex; align-items: center; gap: 8px; color: var(--text-sub); font-size: 14px; }

        /* UNIVERSAL CARD FIX */
        .history-wrapper { padding: 10px 16px 16px; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .history-wrapper::-webkit-scrollbar { display: none; }
        .history-card { flex: 0 0 140px; height: 150px; position: relative; text-decoration: none; display: flex; flex-direction: column; }
        .history-img-box { width: 100%; height: 110px; border-radius: 6px; overflow: hidden; background: #333; flex-shrink: 0; position: relative; }
        .history-img { width: 100%; height: 100%; object-fit: cover; }
        .progress-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.3); }
        .progress-fill { height: 100%; background: var(--accent-green); }
        .history-title { font-size: 12px; color: #ccc; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .footer-text { text-align: center; font-size: 12px; color: var(--text-sub); padding: 10px 0 30px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: var(--bg-card); display: flex; justify-content: space-around; align-items: center; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); text-decoration: none; width: 33.33%; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item span { font-size: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-area">
            <img src="../assets/demon_slayer_s1.jpg" class="profile-pic" id="displayPic">
            <div class="profile-info">
                <div class="profile-name-row"><span class="profile-name" id="displayName">Loading...</span><span class="arrow-right">›</span></div>
                <div class="badge-row">
                    <div class="badge"><span id="displayGender">♂</span></div>
                    <div class="badge">ID: <span id="displayId">---------</span></div>
                </div>
            </div>
        </div>
        <button id="authButton" class="auth-btn">Login</button>
    </div>

    <div class="announcement">Welcome to the official MW Hub website</div>

    <div class="menu-group">
        <div class="menu-item" style="border-bottom:none; padding-bottom:5px;">
            <div class="menu-item-left">🕒 Watch History</div>
            <div class="menu-item-right">›</div>
        </div>
        <div class="history-wrapper" id="historyContainer">
            <div class="footer-text" style="width:100%;">No history found.</div>
        </div>
    </div>

    <div class="menu-group">
        <div class="menu-item" id="btnOpenAdded">
            <div class="menu-item-left">❤️ My Added</div>
            <div class="menu-item-right">›</div>
        </div>
        <div class="menu-item" id="btnOpenEdit">
            <div class="menu-item-left">👤 Edit Profile</div>
            <div class="menu-item-right">›</div>
        </div>
        <a href="https://t.me/+pnQEnRYbIDtiYzFl" class="menu-item">
            <div class="menu-item-left">🎧 Support</div>
            <div class="menu-item-right">›</div>
        </a>
    </div>

    <div class="footer-text">Official website: Max World Hub</div>

    <div class="bottom-nav">
        <a href="#" class="nav-item">📥<span>Downloads</span></a>
        <a href="https://sanmaxworld.github.io/Max-world-hub/index.html" class="nav-item">🏠<span>Home</span></a>
        <a href="#" class="nav-item active">👤<span>Me</span></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAE_oP6wv4A1UxfEdcT82f4KZkhSBzfH3M",
            authDomain: "mw-hub-59e96.firebaseapp.com",
            projectId: "mw-hub-59e96",
            storageBucket: "mw-hub-59e96.firebasestorage.app",
            messagingSenderId: "1084767566489",
            appId: "1:1084767566489:web:5913fcac03c2947c9b1608"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const fixPath = (path) => {
            if (!path) return "assets/placeholder.jpg";
            if (path.startsWith("http") || path.startsWith("data:")) return path;
            return path.replace(/^\.\.\//, ""); 
        };

        function renderHistory(history) {
            const container = document.getElementById('historyContainer');
            if(!history.length) return;
            container.innerHTML = history.map(item => {
                const isMovie = item.type === "movie";
                const progress = isMovie ? 100 : (item.currentEp / item.totalEp) * 100;
                const link = isMovie ? `./movies/${item.id}.html` : `./anime/${item.id}.html`;
                
                return `
                <a href="${link}" class="history-card">
                    <div class="history-img-box">
                        <img src="${fixPath(item.poster)}" class="history-img" onerror="this.src='assets/placeholder.jpg'">
                        <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
                    </div>
                    <div class="history-title">${item.title}</div>
                </a>`;
            }).join('');
        }

        function renderAdded(added) {
            const container = document.getElementById('addedContainer');
            if(!added.length) return;
            container.innerHTML = added.map(item => `
                <a href="${item.type === 'movie' ? './movies/' : './anime/'}${item.id}.html" class="added-card-link">
                    <div class="added-card">
                        <img src="${fixPath(item.poster)}" onerror="this.src='assets/placeholder.jpg'">
                        <div class="added-card-title">${item.title}</div>
                    </div>
                </a>`).join('');
        }
        
        // ... baki code same rahega ...
        onAuthStateChanged(auth, async (user) => {
            if (user) { await loadUserData(); }
        });

        async function loadUserData() {
            const snap = await getDoc(doc(db, "users", auth.currentUser.uid));
            if (snap.exists()) {
                const data = snap.data();
                renderHistory(Object.values(data.watchHistory || {}).sort((a,b) => b.timestamp - a.timestamp));
                renderAdded(data.myAdded || []);
            }
        }
    </script>
</body>
</html>
