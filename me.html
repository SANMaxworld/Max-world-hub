<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MW Hub - My Dashboard</title>
    <style>
        /* (Saari CSS wahi hai jo aapne di thi, ismein maine koi badlav nahi kiya) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --bg-main: #0e0e11; --bg-card: #1c1c22; --text-main: #ffffff; --text-sub: #8e8e93; --accent-green: #00d26a; --divider: #2a2a30; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 16px 15px; }
        .menu-group { background: var(--bg-card); border-radius: 12px; margin: 0 16px 16px; overflow: hidden; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--divider); cursor: pointer; color: #fff; text-decoration: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 350px; border-radius: 16px; padding: 24px; position: relative; }
        .save-btn { width: 100%; padding: 14px; border-radius: 8px; background: var(--accent-green); color: #000; font-weight: 700; border: none; cursor: pointer; opacity: 0.5; }
        .save-btn.ready { opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-info">
            <span class="profile-name" id="displayName">Guest User</span>
            <button id="authButton" class="auth-btn" style="background:#333; color:#fff; border:none; padding:5px 10px; border-radius:5px;">Login</button>
        </div>
    </div>

    <div class="menu-group">
        <div class="menu-item" id="btnOpenAdded"><span>❤️ My Added</span><span>›</span></div>
        <div class="menu-item" id="btnOpenEdit"><span>👤 Edit Profile</span><span>›</span></div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div id="btnCloseEdit" style="cursor:pointer; float:right;">✕</div>
            <div class="modal-title" style="margin-bottom:15px;">Edit Profile</div>
            <input type="text" id="inputName" class="input-box" placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="number" id="inputId" class="input-box" placeholder="123456789" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="save-btn" id="saveBtn">Save Changes</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAE_oP6wv4A1UxfEdcT82f4KZkhSBzfH3M",
            authDomain: "mw-hub-59e96.firebaseapp.com",
            projectId: "mw-hub-59e96",
            storageBucket: "mw-hub-59e96.firebasestorage.app",
            messagingSenderId: "1084767566489",
            appId: "1:1084767566489:web:5913fcac03c2947c9b1608"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('authButton').addEventListener('click', () => signInWithPopup(auth, provider));
            
            document.getElementById('btnOpenEdit').addEventListener('click', () => {
                document.getElementById('editModal').classList.add('show');
            });

            document.getElementById('btnCloseEdit').addEventListener('click', () => {
                document.getElementById('editModal').classList.remove('show');
            });

            document.getElementById('btnOpenAdded').addEventListener('click', () => {
                alert("Opening Added List...");
            });

            document.getElementById('inputName').addEventListener('input', checkValidation);
            document.getElementById('inputId').addEventListener('input', checkValidation);
            document.getElementById('saveBtn').addEventListener('click', saveProfile);
        });

        function checkValidation() {
            const name = document.getElementById('inputName').value.trim();
            const idVal = document.getElementById('inputId').value.toString();
            const btn = document.getElementById('saveBtn');
            if(name.length > 2 && idVal.length === 9) {
                btn.classList.add('ready');
            } else {
                btn.classList.remove('ready');
            }
        }

        async function saveProfile() {
            const btn = document.getElementById('saveBtn');
            if (!btn.classList.contains('ready')) return;
            
            btn.innerText = "Saving...";
            // Firebase logic here...
            alert("Saving logic triggered!");
            btn.innerText = "Save Changes";
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('displayName').innerText = user.displayName;
                document.getElementById('authButton').innerText = "Switch Account";
            }
        });
    </script>
</body>
</html>
