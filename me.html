<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MW Hub - My Dashboard</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAE_oP6wv4A1UxfEdcT82f4KZkhSBzfH3M",
            authDomain: "mw-hub-59e96.firebaseapp.com",
            projectId: "mw-hub-59e96",
            storageBucket: "mw-hub-59e96.firebasestorage.app",
            messagingSenderId: "1084767566489",
            appId: "1:1084767566489:web:5913fcac03c2947c9b1608",
            measurementId: "G-K44QJG0GTM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        window.selectedGender = "♂"; 
        window.tempImageData = null;

        // --- AUTHENTICATION ---
        window.handleLogin = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userRef);
                
                if (!docSnap.exists()) {
                    await setDoc(userRef, {
                        name: user.displayName,
                        gender: "♂",
                        accountId: Math.floor(100000000 + Math.random() * 900000000),
                        profilePic: user.photoURL,
                        watchHistory: []
                    });
                }
            } catch (error) { console.error("Login Error:", error); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-container').style.display = 'none';
                syncData(user.uid);
            } else {
                document.getElementById('login-container').style.display = 'flex';
            }
        });

        // --- DATA SYNC (Profile + History) ---
        function syncData(uid) {
            onSnapshot(doc(db, "users", uid), (snapshot) => {
                const data = snapshot.data();
                if (!data) return;

                // Profile Update
                document.getElementById('displayName').innerText = data.name;
                document.getElementById('displayId').innerText = data.accountId;
                document.getElementById('displayGender').innerText = data.gender;
                document.getElementById('displayGender').className = (data.gender === "♂") ? "badge-blue" : "badge-pink";
                document.getElementById('displayPic').src = data.profilePic;

                // Watch History Update
                const historyWrapper = document.getElementById('history-list');
                historyWrapper.innerHTML = '';
                const history = data.watchHistory || [];
                
                // Newest First
                history.sort((a, b) => b.timestamp - a.timestamp).forEach(item => {
                    historyWrapper.innerHTML += `
                        <div class="history-card" onclick="window.location.href='${item.link}'">
                            <div class="history-img-box">
                                <img src="${item.poster}" class="history-img" onerror="this.src='../assets/default_poster.jpg'">
                                <div class="tv-icon"><svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:#fff;"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg></div>
                                <div class="progress-track"><div class="progress-fill" style="width: ${item.progress}%"></div></div>
                            </div>
                            <div class="history-title">${item.title}</div>
                        </div>`;
                });
            });
        }

        // --- GLOBAL FUNCTIONS FOR BUTTONS ---
        window.openModal = () => document.getElementById('editModal').classList.add('show');
        window.closeModal = () => document.getElementById('editModal').classList.remove('show');

        window.selectGender = (type) => {
            document.getElementById('btnMale').classList.remove('active');
            document.getElementById('btnFemale').classList.remove('active');
            if(type === 'Male') {
                document.getElementById('btnMale').classList.add('active');
                window.selectedGender = "♂";
            } else {
                document.getElementById('btnFemale').classList.add('active');
                window.selectedGender = "♀";
            }
        };

        window.handleImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    window.tempImageData = e.target.result;
                    document.getElementById('previewImg').src = window.tempImageData;
                    window.checkValidation();
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.checkValidation = () => {
            const name = document.getElementById('inputName').value.trim();
            const id = document.getElementById('inputId').value.trim();
            const btn = document.getElementById('saveBtn');
            btn.classList.toggle('ready', name.length > 0 && id.length === 9);
        };

        window.saveProfile = async () => {
            const nameVal = document.getElementById('inputName').value.trim();
            const idVal = document.getElementById('inputId').value.trim();
            if (nameVal && idVal.length === 9 && currentUser) {
                const updateObj = { name: nameVal, accountId: idVal, gender: window.selectedGender };
                if (window.tempImageData) updateObj.profilePic = window.tempImageData;
                
                await updateDoc(doc(db, "users", currentUser.uid), updateObj);
                window.closeModal();
            }
        };

        window.myAddedAction = () => {
            alert("My Added functionality is being synced with your database...");
        };
    </script>

    <style>
        /* [IS SECTION MEIN KOI CHANGE NAHI HAI - AAPKA ORIGINAL CSS] */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --bg-main: #0e0e11; --bg-card: #1c1c22; --text-main: #ffffff; --text-sub: #8e8e93; --accent-red-solid: #ff4d4d; --gradient-red-dark: linear-gradient(180deg, #e60000 0%, #7a0000 100%); --divider: #2a2a30; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 16px 15px; position: relative; }
        .profile-area { display: flex; align-items: center; gap: 12px; }
        .profile-pic { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #333; border: 1px solid var(--divider); }
        .profile-info { display: flex; flex-direction: column; gap: 6px; }
        .profile-name { font-size: 18px; font-weight: 600; }
        .badge { background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 4px; font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        .badge-blue { color: #4facfe; } .badge-pink { color: #ff66b2; }
        .announcement { background: rgba(204, 0, 0, 0.1); color: var(--accent-red-solid); padding: 10px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 16px;}
        .menu-group { background: var(--bg-card); border-radius: 12px; margin: 0 16px 16px; overflow: hidden; padding-top: 5px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--divider); cursor: pointer; }
        .menu-item:last-child { border-bottom: none; }
        .history-wrapper { padding: 10px 16px 16px; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .history-card { flex: 0 0 140px; position: relative; }
        .history-img-box { position: relative; width: 100%; height: 80px; border-radius: 6px; overflow: hidden; background: #333; }
        .history-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .progress-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.3); }
        .progress-fill { height: 100%; background: var(--gradient-red-dark); }
        .history-title { font-size: 12px; color: #ccc; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: var(--bg-card); display: flex; justify-content: space-around; align-items: center; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); text-decoration: none; }
        .nav-item.active { color: var(--accent-red-solid); }
        
        /* LOGIN CSS */
        #login-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #11112b 0%, #050508 100%); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-card { width: 330px; background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(25px); border-radius: 30px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .google-btn-red { background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 100%); color: #fff; padding: 12px 20px; border-radius: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; justify-content: center; }

        /* MODAL CSS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 350px; border-radius: 16px; padding: 24px; border: 1px solid var(--divider); }
        .input-box { width: 100%; background: var(--bg-main); border: 1px solid var(--divider); color: var(--text-main); padding: 12px; border-radius: 8px; margin-top: 5px; }
        .save-btn { width: 100%; padding: 14px; border-radius: 8px; background: var(--gradient-red-dark); color: #fff; border: none; margin-top: 15px; opacity: 0.4; pointer-events: none; }
        .save-btn.ready { opacity: 1; pointer-events: auto; }
        .icon { width: 24px; height: 24px; display: inline-flex; }
        .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; }
    </style>
</head>
<body>

    <div id="login-container" style="display: none;">
        <div class="login-card">
            <h2 style="color:#fff; margin-bottom: 10px;">MW Hub</h2>
            <p style="color:#a0a0ab; font-size: 12px; margin-bottom: 20px;">Premium Anime Destination</p>
            <div class="google-btn-red" onclick="handleLogin()">Continue with Google</div>
        </div>
    </div>

    <div class="header">
        <div class="profile-area">
            <img src="" class="profile-pic" id="displayPic">
            <div class="profile-info">
                <div class="profile-name-row"><span class="profile-name" id="displayName">Loading...</span></div>
                <div class="badge-row">
                    <div class="badge"><span id="displayGender">♂</span></div>
                    <div class="badge">ID: <span id="displayId">...</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="announcement">Welcome to the official MW Hub website</div>

    <div class="menu-group">
        <div class="menu-item" style="border-bottom: none;">
            <div class="menu-item-left">Watch History</div>
        </div>
        <div class="history-wrapper" id="history-list">
            </div>
    </div>

    <div class="menu-group">
        <div class="menu-item" onclick="myAddedAction()"><div class="menu-item-left">My Added</div><div>›</div></div>
        <div class="menu-item" onclick="openModal()"><div class="menu-item-left">Edit Profile</div><div>›</div></div>
    </div>

    <div class="bottom-nav">
        <a href="../index.html" class="nav-item"><span>Home</span></a>
        <a href="#" class="nav-item active"><span>Me</span></a>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Edit Profile</h3>
            <div style="text-align: center; margin-bottom: 15px;">
                <img src="" id="previewImg" class="preview-circle" style="width:60px; height:60px; border-radius:50%;" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImage(this)">
                <p style="color:var(--accent-red-solid); font-size:12px; margin-top:5px;">Change Photo</p>
            </div>
            <input type="text" id="inputName" class="input-box" placeholder="Name" onkeyup="checkValidation()">
            <input type="number" id="inputId" class="input-box" placeholder="9 Digit ID" onkeyup="checkValidation()">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="gender-btn" id="btnMale" onclick="selectGender('Male')">Male</button>
                <button class="gender-btn" id="btnFemale" onclick="selectGender('Female')">Female</button>
            </div>
            <button class="save-btn" id="saveBtn" onclick="saveProfile()">Save</button>
            <p onclick="closeModal()" style="text-align:center; margin-top:15px; color:var(--text-sub); font-size:12px;">Cancel</p>
        </div>
    </div>

</body>
</html>
