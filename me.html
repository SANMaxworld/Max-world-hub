<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me | Max World Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- PROFILE STYLES --- */
        .profile-header { display: flex; align-items: center; padding: 40px 20px 30px; gap: 15px; background: linear-gradient(to bottom, rgba(255,0,0,0.1), transparent); }
        .profile-img-container { position: relative; width: 85px; height: 85px; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #ff0000; object-fit: cover; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
        .edit-icon { position: absolute; bottom: 5px; right: 5px; background: #ff0000; font-size: 10px; padding: 4px; border-radius: 50%; border: 2px solid #000; }
        .user-info h2 { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .user-status { font-size: 0.75rem; color: #ff0000; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .menu-list { margin: 10px 15px; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: 0.2s; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: rgba(255,255,255,0.05); }
        .item-label { display: flex; align-items: center; gap: 15px; color: #eee; font-size: 0.95rem; }
        .arrow { color: #444; font-size: 0.8rem; }

        /* --- SUPPORT MODAL (POP-UP) STYLES --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); }
        .modal-card { width: 85%; max-width: 350px; background: #1a1a1a; border-radius: 20px; padding: 25px; border: 1px solid #333; text-align: center; transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; color: #fff; }
        
        .support-option { display: flex; align-items: center; gap: 15px; background: #252525; padding: 15px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; text-decoration: none; color: white; transition: 0.2s; border: 1px solid transparent; }
        .support-option:hover { background: #333; border-color: #ff0000; }
        .close-modal { margin-top: 15px; display: inline-block; color: #888; font-size: 13px; cursor: pointer; text-decoration: underline; }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="glass-container" style="padding: 0;">
        <div class="profile-header">
            <div class="profile-img-container" onclick="document.getElementById('fileInput').click()">
                <img src="assets/logo.png" id="userPhoto" class="profile-img">
                <span class="edit-icon">✏️</span>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="updatePhoto(this)">
            <div class="user-info">
                <h2 id="userName" onclick="updateName()">Max World User</h2>
                <div class="user-status">Premium Member</div>
            </div>
        </div>

        <div class="menu-list">
            <div class="menu-item" onclick="location.href='index.html'">
                <div class="item-label"><span>🔖</span> My Bookmarks</div>
                <span class="arrow">Soon ➤</span>
            </div>
            <div class="menu-item" onclick="toggleModal(true)">
                <div class="item-label"><span>🎧</span> Support & Help</div>
                <span class="arrow">Contact ➤</span>
            </div>
            <div class="menu-item" onclick="alert('App Version: 2.0.1 (Stable)')">
                <div class="item-label"><span>🛡️</span> App Version</div>
                <span class="arrow" style="color: #666;">2.0.1 ➤</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="supportModal" onclick="toggleModal(false)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-title">Get Support</div>
            
            <a href="https://t.me/+pnQEnRYbIDtiYzFl" target="_blank" class="support-option">
                <span style="font-size: 1.5rem;">🔹</span>
                <div style="text-align: left;"><div style="font-weight: 700;">Telegram</div><div style="font-size: 10px; color: #888;">Join for latest updates</div></div>
            </a>

            <a href="https://discord.gg/YOUR_DISCORD_LINK" target="_blank" class="support-option">
                <span style="font-size: 1.5rem;">👾</span>
                <div style="text-align: left;"><div style="font-weight: 700;">Discord</div><div style="font-size: 10px; color: #888;">Community & Chat</div></div>
            </a>

            <a href="mailto:support@maxworldhub.com" class="support-option">
                <span style="font-size: 1.5rem;">📧</span>
                <div style="text-align: left;"><div style="font-weight: 700;">Default Email</div><div style="font-size: 10px; color: #888;">Send us an inquiry</div></div>
            </a>

            <span class="close-modal" onclick="toggleModal(false)">Close</span>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">🧭</span><span>Explore</span></div>
        <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">🏠</span><span>Home</span></div>
        <div class="nav-item active"><span class="nav-icon">👤</span><span>Me</span></div>
    </nav>

    <script>
        // Profile Logic
        window.onload = function() {
            let userData = JSON.parse(localStorage.getItem("MW_USER_PROFILE") || '{"name":"Max World User", "photo":"assets/logo.png"}');
            document.getElementById('userName').innerText = userData.name;
            document.getElementById('userPhoto').src = userData.photo;
        };

        function updateName() {
            let newName = prompt("Enter your name:", document.getElementById('userName').innerText);
            if(newName && newName.trim() !== "") { saveProfile(newName, document.getElementById('userPhoto').src); }
        }

        function updatePhoto(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) { saveProfile(document.getElementById('userName').innerText, e.target.result); };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveProfile(name, photo) {
            let userData = { name: name, photo: photo };
            localStorage.setItem("MW_USER_PROFILE", JSON.stringify(userData));
            document.getElementById('userName').innerText = name;
            document.getElementById('userPhoto').src = photo;
        }

        // Support Modal Toggle
        function toggleModal(show) {
            const modal = document.getElementById('supportModal');
            if(show) { modal.classList.add('active'); } 
            else { modal.classList.remove('active'); }
        }
    </script>
</body>
</html>
